<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>CaseHub · 测试用例管理</title>
  <link rel="stylesheet" href="/web/vendor/toastui-editor.min.css">
  <link rel="stylesheet" href="/web/vendor/toastui-editor-dark.min.css">
  <link rel="stylesheet" href="/web/style.css">
  <link rel="stylesheet" href="/web/overrides.css">
</head>
<body>
  <header class="topbar">
    <div class="brand"><span class="mark">C</span><div><strong id="app-title">CaseHub</strong><small id="app-subtitle">测试用例管理</small></div></div>
    <div class="header-actions"><a class="header-link" href="/web/api.html">API 文档</a><button class="icon-button" id="theme" title="切换主题">◐</button><span class="avatar">本</span></div>
  </header>
  <nav class="page-tabs" role="tablist">
    <button type="button" class="page-tab active" role="tab" aria-selected="true" data-app="cases">🗂 用例管理</button>
    <button type="button" class="page-tab" role="tab" aria-selected="false" data-app="requirements">📄 需求管理</button>
  </nav>
  <main id="workspace">
    <aside id="sidebar">
      <div class="sidebar-head">
        <div class="segmented"><button class="active" data-view="cases">用例树</button><button data-view="tasks">测试任务</button></div>
        <button class="icon-button" id="collapse" title="折叠">‹</button>
      </div>
      <div id="bulk" class="bulk hidden"><span id="selected-count"></span><button data-bulk="export">导出</button><button data-bulk="feishu">复制飞书思维导图</button><button data-bulk="task">创建任务</button><button data-bulk="move">移动到</button><button data-bulk="merge">合并到主线</button><button data-bulk="delete" class="danger">删除</button></div>
      <div id="case-view"><div id="versions" class="versions"></div><button class="create-version" id="create-version">＋ 创建测试版本</button></div>
      <div id="task-view" class="hidden"><div id="tasks"></div></div>
    </aside>
    <div id="resize-left" class="resizer"></div>
    <button id="expand" class="expand hidden" title="展开侧栏" aria-label="展开侧栏" aria-controls="sidebar">›</button>
    <section id="search-panel" class="search-panel hidden">
      <div class="panel-head"><strong>搜索结果</strong><button class="icon-button" id="close-search">×</button></div>
      <div class="search-form"><input id="search-query" placeholder="标题或 ID"><select id="search-field"><option value="all">全部字段</option><option value="Description">用例描述</option><option value="Preconditions">前置条件</option><option value="Steps">步骤</option><option value="Expected">预期结果</option></select><select id="search-result"><option value="">全部结果</option><option value="none">未执行</option><option value="passed">通过</option><option value="failed">失败</option><option value="blocked">阻塞</option></select><select id="search-mode"><option value="list">平铺</option><option value="tree">目录</option></select><button id="run-search">搜索</button></div>
      <div id="search-results"></div>
    </section>
    <section id="content">
      <div id="empty" class="empty"><div class="empty-icon">⌘</div><h2 id="empty-title">从一个用例开始</h2><p id="empty-hint">选择左侧的文件夹或用例，即可在这里查看详情。</p><button type="button" id="empty-expand" class="hidden">展开用例树</button></div>
      <div id="detail" class="hidden"></div>
    </section>
  </main>
  <main id="req-workspace" class="hidden">
    <aside id="req-sidebar">
      <div class="sidebar-head">
        <div class="segmented"><button class="active" data-reqview="docs">需求文档</button><button data-reqview="review">用例评审</button></div>
        <button class="icon-button" id="req-collapse" title="折叠">‹</button>
      </div>
      <div id="req-doc-view">
        <div id="req-tree" class="versions"></div>
        <button class="create-version" id="create-req-folder">＋ 新建文件夹</button>
        <button class="create-version" id="create-req-doc">＋ 新增需求文档</button>
      </div>
      <div id="req-review-view" class="hidden">
        <div id="review-bulk" class="bulk hidden"><span id="review-selected-count"></span><button type="button" data-review-bulk="clear">取消选择</button><button type="button" data-review-bulk="delete" class="danger">删除</button></div>
        <div id="review-tree" class="versions"></div>
      </div>
    </aside>
    <div id="req-resize-left" class="resizer"></div>
    <button id="req-expand" class="expand hidden" title="展开侧栏" aria-label="展开侧栏" aria-controls="req-sidebar">›</button>
    <section id="req-content">
      <div id="req-empty" class="empty"><div class="empty-icon">📄</div><h2 id="req-empty-title">从一个需求文档开始</h2><p id="req-empty-hint">选择左侧的文件夹或需求文档，即可在这里查看详情。</p><button type="button" id="req-empty-expand" class="hidden">展开需求树</button></div>
      <div id="req-detail" class="hidden"></div>
    </section>
  </main>
  <div id="context-menu" class="context-menu hidden"></div>
  <dialog id="modal"><form id="modal-form"><div class="modal-head"><h3 id="modal-title"></h3><button type="button" class="icon-button" id="modal-close">×</button></div><div id="modal-body"></div><p class="modal-actions"><button type="button" class="secondary" id="modal-cancel">取消</button><button type="submit">保存</button></p></form></dialog>
  <aside id="drawer" class="drawer hidden"><div class="panel-head"><div><strong>测试记录</strong><small id="drawer-case"></small></div><button class="icon-button" id="drawer-close">×</button></div><div id="drawer-case-desc" class="drawer-case-desc"></div><div id="record-history"></div><form id="record-form"><label>提交到版本<select id="record-version"></select></label><label>测试结果<select name="result" required><option value="passed">通过</option><option value="failed">失败</option><option value="blocked">阻塞</option></select></label><div class="record-editor-label" id="record-editor-label">执行备注 · Markdown / 富文本</div><div id="record-editor" aria-labelledby="record-editor-label"></div><div class="drawer-actions"><button type="button" class="secondary" id="save-draft">保存草稿</button><button type="submit">提交记录</button></div></form></aside>
  <aside id="ai-drawer" class="drawer hidden"><div class="panel-head"><div><strong>AI 设计</strong><small id="ai-drawer-doc"></small></div><button class="icon-button" id="ai-drawer-close">×</button></div><div id="ai-drawer-body" class="ai-drawer-body"><p class="meta">AI 设计能力即将上线，敬请期待。</p></div></aside>
  <dialog id="feishu-export" aria-labelledby="feishu-export-title">
    <div class="modal-head"><h3 id="feishu-export-title">复制飞书思维导图</h3><button type="button" class="icon-button" id="feishu-export-close" aria-label="关闭">×</button></div>
    <p>复制后，进入飞书云文档中的白板编辑模式，点击画布空白处，再按 Ctrl+V（Mac：⌘V），生成可编辑的思维导图。</p>
    <p class="meta">请使用下方按钮复制；在文档正文或节点文字编辑状态下粘贴，可能只得到文本。步骤和预期结果分别保留完整内容。</p>
    <pre id="feishu-export-preview"></pre>
    <p id="feishu-export-status" role="status"></p>
    <p class="modal-actions"><button type="button" id="feishu-export-copy">复制思维导图</button></p>
  </dialog>
  <div id="toast" class="toast hidden"></div>
  <script src="/web/vendor/toastui-editor-all.min.js"></script>
  <script src="/web/vendor/zh-cn.js"></script>
  <script src="/web/feishu-export.js"></script>
  <script src="/web/app.js"></script>
</body>
</html>
