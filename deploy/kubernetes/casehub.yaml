apiVersion: apps/v1
kind: Deployment
metadata:
  name: casehub
spec:
  # CaseHub dispatches tasks to the auto-test nodes and is the one writer of their records: run exactly one.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: casehub
  template:
    metadata:
      labels:
        app: casehub
    spec:
      containers:
        - name: casehub
          # Replace with the actual image before deploying.
          image: example.com/casehub:placeholder
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: PORT
              value: "8080"
            - name: CASEHUB_DATA
              value: /app/data/casehub.json
            - name: DATABASE_URL
              # Set a PostgreSQL URL here, or leave empty for local file storage.
              value: ""
            # auto-test planner, generator (also serves the healer) and executor
            # run as separate pools of stateless pods; see auto-test deploy/kubernetes.
            # dns+ resolves the headless Service to every ready pod, and CaseHub hands
            # each task to an idle one. A plain http://planner:4501 still works for a
            # single pod.
            - name: CASEHUB_PLANNER_URL
              value: dns+http://planner-nodes:4501
            - name: CASEHUB_GENERATOR_URL
              value: dns+http://generator-nodes:4502
            - name: CASEHUB_HEALER_URL
              value: dns+http://generator-nodes:4502
            - name: CASEHUB_EXECUTOR_URL
              value: dns+http://executor-nodes:4504
            - name: CASEHUB_GENERAL_AGENT_URL
              value: http://general-agent:4503
          volumeMounts:
            - name: data
              mountPath: /app/data
          readinessProbe:
            httpGet:
              path: /api/state
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: casehub
spec:
  type: NodePort
  selector:
    app: casehub
  ports:
    - name: http
      port: 80
      targetPort: http
      nodePort: 30080
